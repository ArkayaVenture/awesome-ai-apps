[project]
name = "multi-agent-sre-bot"
version = "1.0.0"
description = "Advanced Multi-Agent SRE Bot for Kubernetes with MCP Integration"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "agno>=1.1.1",
    "agents>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.36.0",
    "kubernetes>=28.1.0",
    "boto3>=1.34.0",
    "azure-identity>=1.15.0",
    "azure-mgmt-containerservice>=29.0.0",
    "google-cloud-container>=2.30.0",
    "mcp>=0.9.0",
    "llama-index>=0.10.0",
    "llama-index-embeddings-openai>=0.1.0",
    "llama-index-llms-openai>=0.1.0",
    "llama-index-vector-stores-lancedb>=0.1.0",
    "lancedb>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "streamlit>=1.48.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "rich>=13.9.0",
    # "memori>=0.1.0",  # Optional - requires Python <3.12
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

