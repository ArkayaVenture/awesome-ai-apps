apiVersion: v1
kind: Pod
metadata:
  name: memory-pressure-db
  namespace: database
  labels:
    chaos: "true"
spec:
  containers:
  - name: stress
    image: polinux/stress
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "400M", "--timeout", "300s"]
    resources:
      requests:
        cpu: "100m"
        memory: "100Mi"
      limits:
        cpu: "500m"
        memory: "500Mi"
  restartPolicy: Never

