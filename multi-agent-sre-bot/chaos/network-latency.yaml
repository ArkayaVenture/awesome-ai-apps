apiVersion: v1
kind: Pod
metadata:
  name: network-chaos
  namespace: default
  labels:
    chaos: "true"
spec:
  hostNetwork: true
  containers:
  - name: network-delay
    image: nicolaka/netshoot
    command:
    - /bin/sh
    - -c
    - |
      # Install tc (traffic control)
      apk add --no-cache iproute2
      
      # Add network delay to api-service
      while true; do
        API_PODS=$(kubectl get pods -n api-service -l app=api-service -o jsonpath='{.items[*].status.podIP}')
        for POD_IP in $API_PODS; do
          if [ -n "$POD_IP" ]; then
            echo "🌐 Adding 500ms delay to $POD_IP"
            # This is a simplified example - in production use proper network policies
          fi
        done
        sleep 30
      done
  restartPolicy: Always

